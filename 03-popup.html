<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3. Popup</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.33.0/mapbox-gl.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.33.0/mapbox-gl.js"></script>
</head>
<body class="map-page">
  <header><a href="index.html">← All examples</a><span>3. Popup · Click the pin to read its message.</span></header>
  <div id="notice" class="notice" role="alert" hidden></div>
  <div id="map" aria-label="Interactive map"></div>
  <script src="setup.js"></script>
  <!-- Simplified adaptation: https://docs.mapbox.com/mapbox-gl-js/example/set-popup/ -->
  <script>
    if (MAPBOX_TOKEN.startsWith('pk.') && window.mapboxgl && mapboxgl.supported()) {
    const location = [-77.0353, 38.8895];
    const map = new mapboxgl.Map({
      container: 'map',
      accessToken: MAPBOX_TOKEN,
      style: 'mapbox://styles/mapbox/standard',
      center: location,
      zoom: 14
    });
    reportMapErrors(map);

    // Try writing your own message inside the quotes.
    const popup = new mapboxgl.Popup({ offset: 25 })
      .setText('Hello from the Washington Monument!');

    new mapboxgl.Marker()
      .setLngLat(location)
      .setPopup(popup)
      .addTo(map);
    }
  </script>
</body>
</html>
